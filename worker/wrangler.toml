name = "notify-hub-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "33d023f61ebac424923f7285f9b142f8"

# 自定义域名（zone sloan.dpdns.org 需在当前 Cloudflare 账号内）
routes = [
  { pattern = "notify-hub-worker.sloan.dpdns.org", custom_domain = true }
]

# Cron Triggers：每分钟唤醒一次，扫描 jobs 表执行到期任务
# 只占 1 个 cron 额度（免费档共 5 个），扇出成任意多个用户自定义 job（tick-and-scan 模式）
# 精度：job 只会延迟不会提前，最晚延迟 = 1 个 tick（即 1 分钟），平均 30 秒
# 注意：cron 失败不会重试也不会告警，所以列表里展示了「上次执行」时间供自查
[triggers]
crons = ["* * * * *"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "notify-hub"
database_id = "2f5cf556-d3dd-4047-a55a-6c6613058c17"

# Durable Object 类删除迁移：PushHub 随 App 推送链路一并移除（v1 时引入）
[[migrations]]
tag = "v2"
deleted_classes = ["PushHub"]

# QQ 机器人的凭证 / 触达目标 / 消息模板：**全部在 Web 控制台「机器人」页配置**
# （存 D1 的 bots 表，按账号隔离、保存即生效、无需重新部署）。
#
# 重构说明（2026-09-15）：原先这里的 QQ_APP_ID / QQ_APP_SECRET / QQ_TARGET /
# QQ_GROUP_OPENID / QQ_USER_OPENID 等 env 兜底已**整体移除** —— 它们是全局单份的，
# 会让没有配置机器人的账号意外共用同一个机器人、并把消息发到号主的群/好友上，
# 与「机器人按账号隔离」直接冲突。如果线上凭证此前只写在 secret 里、没进过控制台，
# 需要到控制台重新填一次（或用 0011 迁移前的老库数据自动迁移，见 migrations/0011_bots.sql）。
#
# openid 捕获是自动的：把机器人拉进群 @它 说句话 / 加好友私聊发一句话，
# 即按「触发它的那个机器人」记进 bot_targets，控制台可查看与移除。

