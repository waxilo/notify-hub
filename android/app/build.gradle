plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.notifyhub'
    compileSdk 34

    // CI 注入版本：-PappVersionCode=<run_number> -PappVersionName=1.0.<run_number>
    def appVersionCode = (project.findProperty('appVersionCode') ?: '1') as Integer
    def appVersionName = (project.findProperty('appVersionName') ?: '1.0') as String

    defaultConfig {
        applicationId "com.example.notifyhub"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    // 固定签名：CI 每次构建用同一 keystore，覆盖安装不会报"软件包冲突"（签名不一致）
    signingConfigs {
        app {
            storeFile file("notifyhub-release.p12")
            storePassword "notifyhub2026"
            keyAlias "notifyhub"
            keyPassword "notifyhub2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.app
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
    }

    // 输出文件名带版本：notify-hub-v1.0.<code>-<code>.apk，便于区分不同构建产物
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "notify-hub-v${variant.versionName}-c${variant.versionCode}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
