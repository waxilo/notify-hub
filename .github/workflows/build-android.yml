name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建/更新 GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 项目未提交 Gradle wrapper，使用 gradle-version 直接构建（无需本地 wrapper）
      # 版本号用 run number：App 端检测更新靠 versionCode 对比
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6
          build-root-directory: android
          arguments: :app:assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 发布到 tag latest 的 Release（覆盖旧版），下载链接固定指向
      # https://github.com/waxilo/notify-hub/releases/latest/download/app-debug.apk
      # 策略：优先复用已有 release（仅替换资产与元数据），避免 delete+create 竞态产生草稿
      - name: "Publish APK to Release (latest tag)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ASSET="android/app/build/outputs/apk/debug/app-debug.apk"
          REL_NAME="Android APK v1.0.${{ github.run_number }}"
          NOTES="CI 自动构建的 APK（run ${{ github.run_number }}），可直接下载安装。
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME=1.0.${{ github.run_number }}"
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            REL_ID=$(gh api "repos/$REPO/releases/tags/latest" --jq '.id')
            # 删除旧资产
            for AID in $(gh api "repos/$REPO/releases/$REL_ID/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/$REPO/releases/assets/$AID"
            done
            # 更新元数据并强制非草稿（草稿无法按 tag 名操作，必须用 id）
            gh api -X PATCH "repos/$REPO/releases/$REL_ID" \
              -f name="$REL_NAME" -f body="$NOTES" -F draft=false
            # 上传新 APK（需要显式 Content-Type）
            gh api -X POST "repos/$REPO/releases/$REL_ID/assets?name=app-debug.apk" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --input "$ASSET"
          else
            gh release create latest "$ASSET" \
              --repo "$REPO" \
              --title "$REL_NAME" \
              --notes "$NOTES"
          fi
          # 终验：非草稿才算成功
          gh api "repos/$REPO/releases/tags/latest" --jq '{draft, name, assets: [.assets[].name]}'
