# 本机自托管：API + Web 控制台同一个容器，数据库是同级 ../mysql-server 的共享容器。
#
#   ../mysql-server/scripts/start.sh    # 先把数据库起起来
#   ./scripts/db-init.sh                # 一次性：建库建用户 + 建表 + 生成 .env
#   ./scripts/deploy.sh                 # 跑测试 → 构建 → 起容器 → 探活
#
# 公网入口走同级 ../gw 的共享网关（cloudflared 已带 *.sloan.dpdns.org 通配，
# 由网关上的 nginx 按 Host 分发）：./scripts/gw-join.sh 把
# notify-hub-worker.sloan.dpdns.org 指到 notify-hub:8787。应用自己不开公网端口。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: notify-hub:latest
    container_name: notify-hub
    restart: unless-stopped
    env_file: .env
    environment:
      # 迁移验证期的一次性开关：云上 Worker 的 Cron Trigger 还在跑时，本机容器一起定时器就会
      # 把同一个任务推第二遍（两边的库互不可见，任务级去重拦不住跨库重复）。
      # 只验 HTTP 时：JOBS_TICK_DISABLED=1 ./scripts/deploy.sh
      JOBS_TICK_DISABLED: "${JOBS_TICK_DISABLED:-0}"
    # 只绑 127.0.0.1，且只发布一个端口：80/443 归 ../gw（公网域名实际由它应答），
    # 8787 归 writing-assistant。这里换 8788 是为了本机直连调试时端口不撞车；
    # 网关注入的是容器名:8787，不经过这个映射。
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_PORT:-8788}:8787"
    healthcheck:
      # /healthz 会真的 SELECT 1（探活要连数据库一起探，否则「接口活着、库里连不上」看不出来）。
      # 用 node 而不是 wget/curl：alpine 运行时镜像里只有 node。
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      # 共享 MySQL 的网络：库里的主机名就是 `mysql`。
      # 声明为 external —— 本项目不拥有这两个网络，也就不会在 down 时把别人的摘掉。
      - mysql-server_default
      # 共享公网网关的网络：让它的 nginx 能以 notify-hub:8787 打到本容器。
      - gw_default

networks:
  mysql-server_default:
    external: true
  gw_default:
    external: true
